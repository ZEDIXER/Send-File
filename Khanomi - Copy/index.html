<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ضد آفتاب — خانومی (شبیه‌سازی Tailwind)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/vazir-font@24.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Vazir, sans-serif;
      }
    </style>
  </head>
  <body class="h-5000">
    <header
      id="header"
      class="fixed top-0 left-0 w-full bg-white shadow-md z-50 transition-transform duration-300"
    >
      <div class="flex h-18 mt-0 w-full">
        <div class="flex items-center w-1/2 pt-5 pl-8">
          <button
            onclick="window.location.href='shopping cart.html'"
            class="cursor-pointer"
          >
            <img
              class="ml-5 w-8 h-8"
              src="./img/Sopping Cart.png"
              alt="No Connection"
            />
          </button>
          <div
            class="flex border border-pink-500 ml-5 rounded-md h-10 justify-center"
          >
            <button
              onclick="window.location.href='login.html'"
              class="flex items-center cursor-pointer w-35 justify-center"
            >
              <p class="font-bold pr-2 text-pink-500">ورود</p>
              <img src="./img/Login Icon.png" alt="No Connection" />
            </button>
          </div>
        </div>
        <div class="flex items-center w-1/2">
          <input
            type="text"
            style="background-image: url('./img/Search Icon.png')"
            placeholder="جست و جو"
            class="flex-1 border pr-8 border-gray-300 rounded-sm h-10 items-center mt-5 text-right bg-no-repeat bg-right placeholder-gray-400"
          />
          <button
            onclick="window.location.href='main.html'"
            class="cursor-pointer pl-5"
          >
            <img
              class="pt-5 pr-18 w-45 h-45"
              src="./img/Khanomi Logo.svg"
              alt="No Connection"
            />
          </button>
        </div>
      </div>

      <nav class="mt-5">
        <div
          class="flex h-12 bg-black w-full text-white justify-evenly font-bold"
        >
          <button class="hover:text-pink-500 cursor-pointer">
            مجله خانومی
          </button>
          <button class="hover:text-pink-500 cursor-pointer">طلا و نقره</button>
          <button class="hover:text-pink-500 cursor-pointer">
            کالای دیجیتال
          </button>
          <button class="hover:text-pink-500 cursor-pointer">مد و پوشاک</button>
          <button class="hover:text-pink-500 cursor-pointer">
            مکمل غذایی و ورزشی
          </button>
          <button class="hover:text-pink-500 cursor-pointer">لوازم برقی</button>
          <button class="hover:text-pink-500 cursor-pointer">
            عطر و اسپری
          </button>
          <button class="hover:text-pink-500 cursor-pointer">
            بهداشت شخصی
          </button>
          <button class="hover:text-pink-500 cursor-pointer">
            مراقب و زیبایی مو
          </button>
          <button class="hover:text-pink-500 cursor-pointer">مراقب پوست</button>
          <button class="hover:text-pink-500 cursor-pointer">آرایشی</button>
          <button class="hover:text-pink-500 cursor-pointer">برندها</button>
        </div>
      </nav>
    </header>

    <main class="mt-40 p-5">
      <div class="h-[2000px] bg-gray-100">برای تست اسکرول کنید</div>
    </main>

    <script>
      let lastScroll = 0;
      const header = document.getElementById("header");

      window.addEventListener("scroll", () => {
        const currentScroll = window.pageYOffset;

        if (currentScroll > lastScroll) {
          // اسکرول به پایین → هدر مخفی
          header.style.transform = "translateY(-100%)";
        } else {
          // اسکرول به بالا → هدر ظاهر
          header.style.transform = "translateY(0)";
        }

        lastScroll = currentScroll;
      });
    </script>
  </body>
</html>
