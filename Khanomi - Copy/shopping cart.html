<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>سبد خرید</title>
    <link rel="stylesheet" href="./font.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/vazir-font@24.1.0/dist/font-face.css"
      rel="stylesheet"
    />
  </head>
  <body class="overflow-x-hidden">
    <header class="flex h-18 mt-0 w-screen">
      <div class="flex items-center w-1/2 pt-5 pl-8">
        <button class="cursor-pointer">
          <img
            class="ml-5 w-8 h-8"
            src="./img/Sopping Cart.png"
            alt="No Connection"
          />
        </button>
        <div
          class="flex border-1 border-pink-500 ml-5 rounded-md h-10 justify-center"
        >
          <button
            onclick="window.location.href='login.html'"
            class="flex items-center cursor-pointer w-35 justify-center"
          >
            <p class="font-bold pr-2 text-pink-500">ورود</p>
            <img src="./img/Login Icon.png" alt="No Connection" />
          </button>
        </div>
      </div>
      <div class="flex items-center w-1/2">
        <input
          type="text"
          style="background-image: url('./img/Search\ Icon.png')"
          placeholder="جست و جو"
          class="flex-1 border-1 pr-8 border-gray-300 rounded-sm h-10 items-center mt-5 text-right bg-no-repeat bg-right placeholder-gray-400"
        />
        <button onclick="window.location.href='main.html'" class="cursor-pointer">
          <img
            class="pt-5 pr-18 w-45 h-45"
            src="./img/Khanomi Logo.svg"
            alt="No Connection"
          />
        </button>
      </div>
    </header>
    <nav class="mt-5">
      <div
        class="flex h-12 bg-black w-screen text-white justify-evenly font-bold"
      >
        <button class="hover:text-pink-500 cursor-pointer">مجله خانومی</button
        ><button class="hover:text-pink-500 cursor-pointer">طلا و نقره</button
        ><button class="hover:text-pink-500 cursor-pointer">
          کالای دیجیتال</button
        ><button class="hover:text-pink-500 cursor-pointer">مد و پوشاک</button
        ><button class="hover:text-pink-500 cursor-pointer">
          مکمل غذایی و ورزشی</button
        ><button class="hover:text-pink-500 cursor-pointer">لوازم برقی</button
        ><button class="hover:text-pink-500 cursor-pointer">عطر و اسپری</button
        ><button class="hover:text-pink-500 cursor-pointer">بهداشت شخصی</button
        ><button class="hover:text-pink-500 cursor-pointer">
          مراقب و زیبایی مو</button
        ><button class="hover:text-pink-500 cursor-pointer">مراقب پوست</button
        ><button class="hover:text-pink-500 cursor-pointer">آرایشی</button
        ><button class="hover:text-pink-500 cursor-pointer">برندها</button>
      </div>
    </nav>
    <section class="flex items-center justify-center h-80">
        <div class="flex flex-col w-100 h-110 mt-25 rounded-sm items-center pt-5">
            <img src="./img/Shopping Bag Screenshot.png" alt="No Connection">
            <p class="mt-10 text-gray-400">!سبد خرید شما خالی است</p>
            <div class=" mt-5 w-full px-5 ">
                <button onclick="window.location.href='main.html'" class="h-10 w-full text-pink-500 font-bold rounded-md hover:bg-gray-200 cursor-pointer border border-pink-500">
                    خانه    
                </button>
                   
            </div>
        </div>
        
    </section>
  </body>
</html>
